<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chai aur Code || DOM  </title>
</head>
<body style="background-color: slategray  ",  color = "green" >
    <ul class = "language">
        <li>Typescript</li>
        
    </ul>
</body>
<script>
    function addlanguage (languageName) { // in this function in the addition of the language we are iterating all the list through all the values in the list to add the language nam so we need to do it in the optimized way for  the addition of the language so that we can avoid the iteratio all through elements in the language class list . 
         const li = document.createElement('li');
         li.innerHTML =`${languageName}` 
         document.querySelector('.language').appendChild(li)
        
    }
    addlanguage("Python")
    addlanguage("Javascript")
    addlanguage("Java")
    addlanguage("OCaml")
     function addoptimallang (languageName){
        const li = document.createElement('li');
        li.appendChild(document.createTextNode(languageName))
        document.querySelector('.language').appendChild(li)


     }
    addoptimallang("Cpp")
    addoptimallang("Golang")
    addoptimallang("Go")
    addoptimallang(".Net")

    // Edit 
    const secondlang = document.querySelector("li:nth-child(2)")
    console.log(secondlang);
    
    //  secondlang.innerHTML = "Mojo"  // inner HTML is not really optimized 
    const newli =  document.createElement('li')
    newli.textContent = "Mojo"
    secondlang.replaceWith(newli)
    // edit        
    const firstlang = document.querySelector("li:first-child")
    firstlang.outerHTML = '<li> Raython</li>'
    // remove 
    const lastlang = document.querySelector("li:last-child")
    lastlang.remove()

</script>
</html>
